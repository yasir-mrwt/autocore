name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_SOCKET_URL: ""
        run: npm run build

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/autocore?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/autocore?schema=public
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      DELIVERY_CONFIRMATION_SECRET: ci-delivery-confirmation-secret
      CLIENT_URL: http://localhost:5173
      CLIENT_ORIGIN: http://localhost:5173
      INFLOWAPM_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          find . \
            -path ./node_modules -prune -o \
            -path ./dist -prune -o \
            -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Backend smoke tests
        run: npm test

      - name: Netlify Function smoke tests
        run: npm run netlify:smoke
