services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autocore}
      POSTGRES_USER: ${POSTGRES_USER:-autocore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autocore_dev_password}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-autocore}:${POSTGRES_PASSWORD:-autocore_dev_password}@db:5432/${POSTGRES_DB:-autocore}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-autocore}:${POSTGRES_PASSWORD:-autocore_dev_password}@db:5432/${POSTGRES_DB:-autocore}?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-change-this-access-token-secret}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-autocore_refresh}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PASSWORD_SALT_ROUNDS: ${PASSWORD_SALT_ROUNDS:-12}
      DELIVERY_CONFIRMATION_SECRET: ${DELIVERY_CONFIRMATION_SECRET:-change-this-delivery-confirmation-secret}
      ADMIN_NAME: ${ADMIN_NAME:-AutoCore Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autocore.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-pkr}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-autocore/products}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-AutoCore}
      INFLOWAPM_API_KEY: ${INFLOWAPM_API_KEY:-}
      INFLOWAPM_ENDPOINT: ${INFLOWAPM_ENDPOINT:-}
      INFLOWAPM_SERVICE: ${INFLOWAPM_SERVICE:-autocore-api}
      INFLOWAPM_ENVIRONMENT: ${INFLOWAPM_ENVIRONMENT:-development}
      INFLOWAPM_SERVICE_VERSION: ${INFLOWAPM_SERVICE_VERSION:-1.0.0}
      INFLOWAPM_ENABLED: ${INFLOWAPM_ENABLED:-true}
      INFLOWAPM_DEBUG: ${INFLOWAPM_DEBUG:-false}
    ports:
      - "${BACKEND_PORT:-14322}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - backend-node-modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund --prefer-offline && npm run prisma:generate && npm run prisma:deploy && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./client
      target: development
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:14322/api/v1}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:14322}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  backend-node-modules:
  frontend-node-modules:
