[build]
  command = "npm run netlify:build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24.20.0"
  VITE_API_BASE_URL = "/api/v1"
  VITE_SOCKET_URL = ""

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/adapter-pg",
    "@prisma/client",
    "@inflowapm/node",
    "bcrypt",
    "body-parser",
    "cloudinary",
    "cors",
    "express",
    "express-fileupload",
    "express-validator",
    "morgan",
    "nodemailer",
    "pg",
    "serverless-http",
    "stripe"
  ]
  included_files = ["server/prisma/**"]

[functions."delivery-confirmations"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
